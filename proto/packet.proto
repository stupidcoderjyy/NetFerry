syntax = "proto3";
package gateway;

// 请求包（内网客户端 -> 内网网关 -> 文件 -> 外网网关 -> 目标服务器）
message RequestPacket {
  string request_id = 1;
  string method = 2;          // GET, POST, PUT, DELETE, etc.
  string url = 3;             // 完整的请求URL（含路径和查询参数）
  map<string, string> headers = 4;
  bytes body = 5;
}

// 响应包（目标服务器 -> 外网网关 -> 文件 -> 内网网关 -> 内网客户端）
message ResponsePacket {
  string request_id = 1;
  int32 status_code = 2;
  map<string, string> headers = 3;
  bytes body = 4;
}